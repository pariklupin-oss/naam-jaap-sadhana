const defaults=["राम राम","सीताराम","राधा राधा","हरे राम हरे राम राम राम हरे हरे हरे कृष्ण हरे कृष्ण कृष्ण कृष्ण कृष्ण हरे हरे"];
const key="naam-jaap-local-v1";
const max=1e9;
const byId=id=>document.getElementById(id);
const clean=v=>v.normalize("NFC").trim().replace(/\s+/g," ");
const fresh=()=>({names:[...defaults],mantra:defaults[0],art:"ram",elapsed:0,rows:[]});
const message=(s,error=false)=>{byId("message").textContent=s;byId("message").classList.toggle("error",error);};
function valid(data){
 if(!data||!Array.isArray(data.names)||!Array.isArray(data.rows)||data.names.length>200||data.rows.length>20000)throw Error();
 const names=[...new Set([...defaults,...data.names.map(n=>{if(typeof n!=="string"||!clean(n)||n.length>160)throw Error();return clean(n);})])];
 const rows=[];const seen=new Set();
 for(const r of data.rows){
  if(!Array.isArray(r)||r.length!==3||!names.includes(r[0])||typeof r[1]!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(r[1])||!Number.isSafeInteger(r[2])||r[2]<0||r[2]>max)throw Error();
  const id=JSON.stringify(r.slice(0,2));if(seen.has(id))throw Error();seen.add(id);if(r[2])rows.push(r);
 }
 return {names,rows,mantra:names.includes(data.mantra)?data.mantra:names[0],art:["ram","hanuman","krishna","plain"].includes(data.art)?data.art:"ram",elapsed:Number.isSafeInteger(data.elapsed)&&data.elapsed>=0?data.elapsed:0};
}
let state=fresh(), running=null;
try{const saved=localStorage.getItem(key);if(saved)state=valid(JSON.parse(saved));}
catch{message("पुराना रिकॉर्ड पढ़ा नहीं जा सका। अगर बैकअप है तो उसे खोलें।",true);}
function elapsed(){return state.elapsed+(running===null?0:Math.floor(performance.now()-running));}
function snapshot(){return {...state,elapsed:elapsed()};}
function save(){
 try{localStorage.setItem(key,JSON.stringify(snapshot()));}
 catch{message("यह ब्राउज़र रिकॉर्ड सेव नहीं कर पा रहा। पेज बंद करने से पहले बैकअप सेव करें।",true);}
}
function today(){const d=new Date();return [d.getFullYear(),d.getMonth()+1,d.getDate()].map(n=>String(n).padStart(2,"0")).join("-");}
function formatDay(day){const [y,m,d]=day.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("hi-IN",{day:"numeric",month:"long",year:"numeric"});}
function renderOptions(){
 const menu=byId("mantra");menu.replaceChildren();
 for(const name of state.names){menu.add(new Option(name,name));}
 const add=new Option("＋ अपना मंत्र जोड़ें","");menu.add(add);menu.value=state.mantra;
 byId("art").value=state.art;
 byId("hero").style.backgroundImage=Object.hasOwn(artwork,state.art)?"linear-gradient(transparent 22%,#30160cc0),url("+artwork[state.art]+")":"";
}
function render(){
 const date=today();byId("day").textContent=formatDay(date)+" · आज के जाप";
 const selected=state.rows.filter(r=>r[0]===state.mantra);
 const n=selected.find(r=>r[1]===date)?.[2]??0;
 byId("count").textContent=n;byId("mala").textContent=Math.floor(n/108)+" माला पूरी · "+n%108+" / 108";byId("progress").value=n%108;
 byId("selectedTotal").textContent=selected.reduce((sum,r)=>sum+r[2],0);
 byId("total").textContent=state.rows.reduce((sum,r)=>sum+r[2],0);
 byId("rows").replaceChildren(...selected.sort((a,b)=>b[1].localeCompare(a[1])).map(([,date,count])=>{
  const tr=document.createElement("tr");const d=tr.insertCell();d.textContent=formatDay(date);tr.insertCell().textContent=count;return tr;
 }));
 byId("empty").hidden=selected.length>0;
}
function change(delta){
 const day=today();const index=state.rows.findIndex(r=>r[0]===state.mantra&&r[1]===day);
 const n=Math.max(0,Math.min(max,(state.rows[index]?.[2]??0)+delta));
 if(index>=0){if(n)state.rows[index][2]=n;else state.rows.splice(index,1);}
 else if(n){if(state.rows.length>=20000){message("रिकॉर्ड की सीमा पूरी हो गई। बैकअप सेव करें।",true);return;}state.rows.push([state.mantra,day,n]);}
 save();render();
}
function drawClock(){
 const seconds=Math.floor(elapsed()/1000);
 byId("timer").textContent=[Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(n=>String(n).padStart(2,"0")).join(":");
}
byId("clockToggle").onclick=()=>{
 if(running===null){running=performance.now();byId("clockToggle").textContent="टाइमर रोकें";}
 else{state.elapsed=elapsed();running=null;byId("clockToggle").textContent="टाइमर शुरू करें";}
 save();drawClock();
};
byId("plus").onclick=()=>change(1);byId("minus").onclick=()=>change(-1);
byId("mantra").onchange=e=>{
 if(!e.target.value){byId("custom").hidden=false;byId("customName").focus();return;}
 state.mantra=e.target.value;byId("custom").hidden=true;save();render();
};
byId("saveMantra").onclick=()=>{
 const input=byId("customName"), name=clean(input.value);
 if(!name||name.length>160)return;
 if(!state.names.includes(name)){if(state.names.length>=200){message("मंत्रों की सीमा पूरी हो गई।",true);return;}state.names.push(name);}
 state.mantra=name;input.value="";byId("custom").hidden=true;save();renderOptions();render();
};
byId("art").onchange=e=>{state.art=e.target.value;save();renderOptions();};
byId("export").onclick=()=>{
 const blob=new Blob([JSON.stringify(snapshot(),null,2)],{type:"application/json"}), url=URL.createObjectURL(blob);
 const link=document.createElement("a");link.href=url;link.download="Naam-Jaap-Backup-"+today()+".json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
byId("restore").onclick=()=>byId("file").click();
byId("file").onchange=async e=>{
 const file=e.target.files[0];e.target.value="";if(!file)return;
 try{
  if(file.size>4000000)throw Error();
  const imported=valid(JSON.parse(await file.text()));
  if(!confirm("बैकअप खोलने पर इस ब्राउज़र का मौजूदा जाप रिकॉर्ड बदल जाएगा। जारी रखें?"))return;
  running=null;state=imported;byId("clockToggle").textContent="टाइमर शुरू करें";renderOptions();render();drawClock();message("बैकअप खोल दिया गया।");save();
 }catch{message("यह नाम जाप साधना की वैध बैकअप फ़ाइल नहीं है।",true);}
};
setInterval(drawClock,250);
setInterval(()=>{if(running!==null)save();if(!byId("day").textContent.startsWith(formatDay(today())))render();},3000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&running!==null)save();});
window.addEventListener("pagehide",()=>{if(running!==null)save();});
const voiceStatus=text=>{byId("voiceStatus").textContent=text;};
let micStream=null, audioContext=null, meterFrame=0, speech=null, micPending=false, speechPending=false;
function stopMeter(){
 cancelAnimationFrame(meterFrame);
 if(micStream)for(const track of micStream.getTracks())track.stop();
 if(audioContext)audioContext.close().catch(()=>{});
 micStream=null;audioContext=null;
 byId("level").hidden=true;byId("level").value=0;byId("mic").textContent="माइक मीटर शुरू करें";
}
byId("mic").onclick=async()=>{
 if(micStream){stopMeter();return;}
 if(micPending)return;
 if(!navigator.mediaDevices?.getUserMedia||!window.AudioContext){voiceStatus("इस जगह माइक नहीं खुल सकता। पेज को सामान्य ब्राउज़र के HTTPS लिंक से खोलें।");return;}
 micPending=true;
 try{
  audioContext=new AudioContext();
  await audioContext.resume();
  micStream=await navigator.mediaDevices.getUserMedia({audio:true});
  const analyser=audioContext.createAnalyser();
  audioContext.createMediaStreamSource(micStream).connect(analyser);
  const buffer=new Float32Array(analyser.fftSize);
  const draw=()=>{
   analyser.getFloatTimeDomainData(buffer);
   const rms=Math.sqrt(buffer.reduce((sum,v)=>sum+v*v,0)/buffer.length);
   byId("level").value=Math.max(0,Math.min(100,(20*Math.log10(Math.max(rms,1e-7))+65)*100/65));
   meterFrame=requestAnimationFrame(draw);
  };
  byId("level").hidden=false;byId("mic").textContent="माइक मीटर बंद करें";draw();
 }catch{stopMeter();voiceStatus("माइक नहीं खुला। ब्राउज़र और फ़ोन में माइक्रोफ़ोन की अनुमति देखें।");}
 finally{micPending=false;}
};
const speechOptions={langs:["hi-IN"],processLocally:true};
const speechConstructor=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
const voiceWords=value=>clean(value.replace(/[\p{P}]+/gu," ").replace(/(^|\s)(सीताराम|रामराम)(?=\s|$)/g,
 (_,space,word)=>space+(word==="सीताराम"?"सीता राम":"राम राम"))).split(" ").filter(Boolean);
byId("language").onclick=async()=>{
 const engine=speechConstructor();if(!engine?.install)return;
 byId("language").disabled=true;
 try{if(await engine.install(speechOptions)){byId("language").hidden=true;voiceStatus("हिंदी पैक तैयार है। अब ऑफलाइन वॉइस गिनती दबाएँ।");}
 else voiceStatus("हिंदी पैक डाउनलोड नहीं हुआ।");}
 catch{voiceStatus("यह ब्राउज़र यहाँ से हिंदी पैक डाउनलोड नहीं कर पाया।");}
 finally{byId("language").disabled=false;}
};
byId("speech").onclick=async()=>{
 if(speech){speech.stop();return;}
 if(speechPending)return;
 const engine=speechConstructor();
 if(!engine||!("processLocally" in engine.prototype)||typeof engine.available!=="function"){
  voiceStatus("इस ब्राउज़र में ऑफलाइन वॉइस गिनती उपलब्ध नहीं है। आप माइक मीटर और +1 इस्तेमाल कर सकते हैं।");return;
 }
 speechPending=true;
 try{
  const ready=await engine.available(speechOptions);
  if(ready!=="available"){
   byId("language").hidden=!(ready==="downloadable"&&typeof engine.install==="function");
   voiceStatus(ready==="unavailable"?"इस फ़ोन या ब्राउज़र में ऑफलाइन हिंदी उपलब्ध नहीं है।":"पहले ऑफलाइन हिंदी पैक तैयार करें।");return;
  }
  const recognizer=new engine();
  recognizer.processLocally=true;recognizer.lang="hi-IN";recognizer.continuous=true;
  let tail=[], matchedMantra=state.mantra, failed=false;
  recognizer.onresult=event=>{
   if(speech!==recognizer)return;
   if(matchedMantra!==state.mantra){tail=[];matchedMantra=state.mantra;}
   const phrase=voiceWords(matchedMantra);
   if(!phrase.length)return;
   let confirmed=0;
   for(let i=event.resultIndex;i<event.results.length;i++){
    const result=event.results[i];if(!result.isFinal)continue;
    for(const word of voiceWords(result[0].transcript)){
     tail.push(word);if(tail.length>phrase.length)tail.shift();
     if(tail.length===phrase.length&&tail.every((v,j)=>v===phrase[j])){confirmed++;tail=[];}
    }
   }
   if(confirmed)change(confirmed);
  };
  recognizer.onerror=()=>{failed=true;voiceStatus("ऑफलाइन पहचान रुक गई। माइक की अनुमति देखें या +1 से गिनें।");};
  recognizer.onend=()=>{if(speech!==recognizer)return;speech=null;byId("speech").textContent="ऑफलाइन वॉइस गिनती";if(!failed)voiceStatus("वॉइस गिनती बंद है।");};
  speech=recognizer;
  recognizer.start();
  byId("speech").textContent="वॉइस गिनती रोकें";voiceStatus("फ़ोन पर ही हिंदी पहचान चल रही है।");
 }catch{speech=null;voiceStatus("यहाँ ऑफलाइन वॉइस गिनती शुरू नहीं हो सकी।");}
 finally{speechPending=false;}
};
window.addEventListener("pagehide",()=>{if(micStream)stopMeter();if(speech)speech.abort();});
renderOptions();render();drawClock();
</script>
</html>
