name: Publish Naam Jaap
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: naam-jaap-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package verified Hindi speech assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/speech model
          curl --fail --location --retry 3 'https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip' -o hindi.zip
          echo '7c50a10866889f0ac21d912c20537a055a597ed09fc1d3e5bcd798f9f0017e48  hindi.zip' | sha256sum --check
          unzip -q hindi.zip -d model
          tar -C model -czf dist/speech/hindi.tar.gz vosk-model-small-hi-0.22
          curl --fail --location --retry 3 'https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js' -o dist/speech/vosk.js
          echo '29504515526e974f4cb053cf08811c4de5fb2a74007c0a5a957db50eaa8d5d0c  dist/speech/vosk.js' | sha256sum --check
          cp speech-browser.js dist/
          python3 build-pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deploy